name: Tests and Coverage

"on":
  push:
    branches:
      - main
  pull_request:

jobs:
  schema:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Validate analysis project schema
        uses: ./.github/actions/validate-analysis-projects
        with:
          root: demo-projects

      - name: Validate demo-project output schema
        uses: ./.github/actions/validate-project-outputs
        with:
          root: demo-projects
          require_project_files: "true"

      - name: Validate test fixture output schema
        uses: ./.github/actions/validate-project-outputs
        with:
          root: tests/fixtures/prebuilt_public_project
          require_project_files: "true"

  unit-test:
    needs: schema
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install project and unit test dependencies
        run: |
          python3 -m pip install uv
          make sync-deps-exact

      - name: Run unit tests and measure code coverage
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          make test MARKER="unit" TESTS_PATH=tests/unit

      - name: Upload coverage.xml artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: error

      - name: Upload coverage report to Codecov (best effort)
        continue-on-error: true
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f
        with:
          files: ./coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          verbose: true

  frontend-smoke-test:
    needs: schema
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install frontend smoke test dependencies
        run: |
          python -m pip install uv
          make sync-deps-exact

      - name: Run frontend smoke tests
        env:
          PLAYWRIGHT_ARTIFACTS_DIR: test-results/playwright
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          make test MARKER="e2e" TESTS_PATH=tests/frontend-smoke

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: playwright-artifacts
          path: test-results/playwright
          if-no-files-found: ignore
